name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: backtrack-planner
  GCP_REGION: us-east4
  CLOUD_RUN_SERVICE: backtrack-api
  FIREBASE_PROJECT_ID: backtrack-planner
  # Cloud Run service URLs are stable for the life of the service. Deliberately
  # not taken from the deploy job's `url` output: that output is `status.url`,
  # which returns this service's legacy *.a.run.app hostname, not this one.
  VITE_API_BASE_URL: https://backtrack-api-218665896593.us-east4.run.app

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: backtrack
          POSTGRES_PASSWORD: backtrack
          POSTGRES_DB: backtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtrack -d backtrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://backtrack:backtrack@localhost:5432/backtrack

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run typecheck:backend

      - run: npm run build

      - run: npm run db:migrate

      - run: npm run db:seed

      - run: npm test

  deploy-backend:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: ${{ env.VITE_API_BASE_URL }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_RUN }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          source: .
          # Explicit rather than relying on "deploys default to 100% traffic
          # on the new revision": that default only holds while the service
          # is in latest-following mode, and a prior --no-traffic/--tag
          # deploy (used to verify this pipeline) switched it to a pinned
          # named-revision split that a plain deploy does not automatically
          # undo. Being explicit here means every future deploy re-asserts
          # the intended state regardless of the service's current mode.
          revision_traffic: LATEST=100
          # env_vars is deliberately NOT set. Empty env_vars means the action
          # emits no env-related flag at all to `gcloud run deploy`, so the
          # existing DATABASE_URL / ALLOWED_ORIGINS / NODE_ENV on the service
          # are preserved verbatim.

      - name: Assert 100% traffic actually landed on the new revision
        run: |
          TRAFFIC=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format=json | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin)['status']['traffic']))")
          echo "traffic=$TRAFFIC"
          echo "$TRAFFIC" | python3 -c "
          import sys, json
          traffic = json.load(sys.stdin)
          ok = any(t.get('latestRevision') and t.get('percent') == 100 for t in traffic)
          sys.exit(0 if ok else 1)
          " || { echo "::error::Deploy did not result in 100% traffic on the latest revision. The old revision may still be serving production."; exit 1; }

      - name: Assert ALLOWED_ORIGINS survived the deploy
        run: |
          ORIGINS=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(spec.template.spec.containers[0].env.filter("name:ALLOWED_ORIGINS").extract(value))')
          echo "ALLOWED_ORIGINS=$ORIGINS"
          if [ -z "$ORIGINS" ]; then
            echo "::error::ALLOWED_ORIGINS is empty after deploy - CORS config was wiped."
            exit 1
          fi

      - name: Smoke test the deployed API
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$VITE_API_BASE_URL/api/health"; then
              echo "healthy"; exit 0
            fi
            echo "attempt $i failed (cold start?), retrying..."; sleep 10
          done
          echo "::error::/api/health never returned success"; exit 1

  deploy-frontend:
    needs: [test, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://backtrack-planner.web.app
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Assert the API URL was actually inlined into the bundle
        run: |
          if ! grep -rq "$VITE_API_BASE_URL" dist/assets; then
            echo "::error::VITE_API_BASE_URL was not inlined into the built bundle."
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_HOSTING }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --message "${GITHUB_SHA::7} - ${GITHUB_REF_NAME}"
